name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: common-repo/semantic-release/ci/${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: a change in the apply output of a newer common-repo would
      # make `common-repo diff` fail in every consumer at once.
      - uses: common-repo/setup-common-repo@887d2b31e6678fb650d1b1b6fb6097afa5528310 # v1
        with:
          version: v0.38.2

      - name: Validate configuration
        run: common-repo validate

      # `common-repo diff` exits 1 when a managed file differs from the
      # result of `common-repo apply`. `common-repo apply --dry-run` exits 0
      # in that case, so it cannot be the check.
      - name: Check managed files
        run: common-repo diff

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: |
          [ ! -x "script/test" ] || script/test
