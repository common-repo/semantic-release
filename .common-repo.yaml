# Local consumption — apply our own source files to this repo
- self:
    - repo:
        url: https://github.com/common-repo/upstream
        ref: v2.1.5
    - include:
        - "src/**"
    - template:
        - "src/.github/workflows/release.yaml"
    - rename:
        - "^src/(.*)$": "$1"
    - template-vars:
        GH_APP_ID_SECRET: COMMON_REPO_BOT_CLIENT_ID
        GH_APP_KEY_SECRET: COMMON_REPO_BOT_PRIVATE_KEY
        GH_APP_OWNER: common-repo

# Source API — what consumers inherit
# Source and self pipelines have separate variable scopes. These defaults
# allow local apply; consumer with: template-vars override them.
- template-vars:
    GH_APP_ID_SECRET: COMMON_REPO_BOT_CLIENT_ID
    GH_APP_KEY_SECRET: COMMON_REPO_BOT_PRIVATE_KEY
    GH_APP_OWNER: common-repo
- include:
    - "src/**"
# ci.yaml is a merge-composable sensible-default stub. Re-include it
# narrowly with `if-exists: preserve` so a consumer's existing
# .github/workflows/ci.yaml survives the sequential pass: last-op-wins
# on the same path re-stamps ci.yaml's tag from `overwrite` to
# `preserve` after the wide include above. The auto-merge declaration
# below then merges the stub into that file at the residual stage, so
# consumers get the stub's jobs layered in instead of having to declare
# the merge on their repo: entry (or lose their workflow to the stub).
- include:
    - "src/.github/workflows/ci.yaml"
  if-exists: preserve
- template:
    - "src/.github/workflows/release.yaml"
- rename:
    - "^src/(.*)$": "$1"
# Deferred merge for the ci.yaml stub. Declared after `rename`, which
# produces the root-level path the declaration references. Because it
# is deferred, the merge intent carries to every inheritor, including
# through intermediate upstream repos, with no consumer-side with: ops.
- yaml:
    auto-merge: .github/workflows/ci.yaml
    array_mode: append_unique
- repo:
    url: https://github.com/common-repo/conventional-commits
    ref: v1.4.1
