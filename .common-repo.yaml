# Local consumption — apply our own source files to this repo
- self:
    - repo:
        url: https://github.com/common-repo/upstream
        ref: v2.1.5
    - include:
        - "src/**"
    - template:
        - "src/.github/workflows/release.yaml"
    - rename:
        - "^src/(.*)$": "$1"
    - template-vars:
        GH_APP_ID_SECRET: COMMON_REPO_BOT_CLIENT_ID
        GH_APP_KEY_SECRET: COMMON_REPO_BOT_PRIVATE_KEY
        GH_APP_OWNER: common-repo

# Source API — what consumers inherit
- include:
    - "src/**"
# ci.yaml is a sensible-default stub. Re-include narrowly with
# `if-exists: preserve` so consumers who maintain their own
# .github/workflows/ci.yaml keep it across re-propagations.
# Last-op-wins on the same path means this re-stamps ci.yaml's
# tag from `overwrite` to `preserve` after the wide include above.
- include:
    - "src/.github/workflows/ci.yaml"
  if-exists: preserve
- template:
    - "src/.github/workflows/release.yaml"
- rename:
    - "^src/(.*)$": "$1"
- repo:
    url: https://github.com/common-repo/conventional-commits
    ref: v1.4.1
